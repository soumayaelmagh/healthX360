name: Check Contentful for Updates and Trigger Deploy

on:
  schedule:
    # Adjust the schedule as needed. This example runs every 15 minutes.
    # See https://crontab.guru/ for cron syntax help.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI for testing

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    # Define environment variables that will be available to all steps in this job
    env:
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
      CONTENTFUL_ENVIRONMENT: 'master' # Or your specific Contentful environment ID
      # Timezone for the 'date' command used in the commit message/trigger file
      TZ: 'UTC' 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Use latest major version
        with:
          # This token is used by the checkout action if needed, 
          # but the main commit push uses PAT_FOR_COMMIT below.
          # Using the default GITHUB_TOKEN is often fine for checkout.
          # token: ${{ secrets.GITHUB_TOKEN }} # Default, usually sufficient for checkout
          # If you need to push back to the repo, you'll use a PAT for that step.
          persist-credentials: false # Recommended if using a PAT for subsequent git operations

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Use latest major version
        with:
          node-version: '18' # Or '20', or your preferred Node.js LTS version
          cache: 'npm' # Optional: cache npm dependencies if you install many

     # ... (previous parts of the workflow file are fine) ...

      - name: Install dependencies for script
        # Install only if needed and not already in your project's devDependencies
        # Using --no-save to avoid modifying package-lock.json by this utility script
        run: npm install contentful date-fns --no-save 

      - name: Check for recent Contentful updates
        id: contentful_check # Give an ID to this step to access its outputs
        # THE 'run:' BLOCK MUST BE INDENTED TO THE SAME LEVEL AS 'id:' for this step
        run: |  # <--- THIS LINE AND EVERYTHING BELOW IT IN THIS SCRIPT
            # last_check_timestamp.txt stores the timestamp of the last known update from Contentful
            # It defaults to a very old date if the file doesn't exist.
            LAST_KNOWN_UPDATE_FROM_FILE=$(cat last_check_timestamp.txt 2>/dev/null || echo "1970-01-01T00:00:00Z")
            echo "Last known update timestamp from file: $LAST_KNOWN_UPDATE_FROM_FILE"

            # Node.js script to query Contentful
            node -e "
              const fs = require('fs'); // <--- REQUIRED for GITHUB_OUTPUT
              const contentful = require('contentful');
              const { isAfter, parseISO, formatISO } = require('date-fns');

              const client = contentful.createClient({
                space: process.env.CONTENTFUL_SPACE_ID,
                accessToken: process.env.CONTENTFUL_DELIVERY_TOKEN,
                environment: process.env.CONTENTFUL_ENVIRONMENT || 'master',
              });

              let currentLatestUpdateTimestamp = '$LAST_KNOWN_UPDATE_FROM_FILE';
              let newUpdatesFound = false;

              async function checkForUpdates(contentType) {
                try {
                  const response = await client.getEntries({
                    content_type: contentType,
                    'sys.updatedAt[gt]': '$LAST_KNOWN_UPDATE_FROM_FILE',
                    order: '-sys.updatedAt',
                    limit: 20
                  });
                  if (response.items.length > 0) {
                    console.log(\`Found \${response.items.length} updated entries (\${contentType || 'any type'}) since $LAST_KNOWN_UPDATE_FROM_FILE\`);
                    response.items.forEach(item => {
                       console.log(\`- \${item.sys.id} (\${item.sys.contentType.sys.id}) updated at \${item.sys.updatedAt}\`);
                       if (isAfter(parseISO(item.sys.updatedAt), parseISO(currentLatestUpdateTimestamp))) {
                         currentLatestUpdateTimestamp = item.sys.updatedAt;
                       }
                    });
                    newUpdatesFound = true;
                  }
                } catch (error) {
                  console.error(\`Error fetching entries (\${contentType || 'any type'}) from Contentful:\`, error.message);
                }
              }
              
              async function checkAssets() {
                try {
                  const response = await client.getAssets({
                    'sys.updatedAt[gt]': '$LAST_KNOWN_UPDATE_FROM_FILE',
                    order: '-sys.updatedT',
                    limit: 20
                  });
                  if (response.items.length > 0) {
                    console.log(\`Found \${response.items.length} updated assets since $LAST_KNOWN_UPDATE_FROM_FILE\`);
                    response.items.forEach(item => {
                       console.log(\`- Asset \${item.sys.id} updated at \${item.sys.updatedAt}\`);
                       if (isAfter(parseISO(item.sys.updatedAt), parseISO(currentLatestUpdateTimestamp))) {
                         currentLatestUpdateTimestamp = item.sys.updatedAt;
                       }
                    });
                    newUpdatesFound = true;
                  }
                } catch (error) {
                  console.error('Error fetching assets from Contentful:', error.message);
                }
              }

              async function runChecks() {
                await checkForUpdates(); // Check all entries
                await checkAssets();

                fs.appendFileSync(process.env.GITHUB_OUTPUT, \`has_new_updates=\${newUpdatesFound}\n\`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, \`latest_update_timestamp=\${formatISO(parseISO(currentLatestUpdateTimestamp))}\n\`);
              }
              runChecks().catch(err => { console.error('Error in runChecks:', err); process.exit(1); });
            " # End of the node -e script string

      # THIS STEP MUST START WITH A HYPHEN AND BE AT THE SAME INDENTATION LEVEL AS THE PREVIOUS STEP
      - name: Commit and Push if changes found 
        if: steps.contentful_check.outputs.has_new_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_COMMIT }} 
          GITHUB_USER: 'GitHub Actions Bot'
        run: |
          echo "New Contentful updates detected. Most recent update was at: ${{ steps.contentful_check.outputs.latest_update_timestamp }}"
          echo "${{ steps.contentful_check.outputs.latest_update_timestamp }}" > last_check_timestamp.txt
          echo "Contentful deploy trigger: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > contentful_redeploy_trigger.txt

          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_USER_EMAIL:-github-actions-bot@users.noreply.github.com}" 
          
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          
          git add last_check_timestamp.txt contentful_redeploy_trigger.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: Contentful update at ${{ steps.contentful_check.outputs.latest_update_timestamp }}, triggering site redeploy [skip ci]"
            git push origin HEAD:${{ github.ref_name }} 
            echo "Changes committed and pushed."
          else
            echo "No file changes to commit, but Contentful update was detected."
          fi

      - name: No new Contentful updates
        if: steps.contentful_check.outputs.has_new_updates == 'false'
        run: echo "No new Contentful updates found to trigger redeploy."
