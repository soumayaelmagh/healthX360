# .github/workflows/contentful_webhook.yml
name: Contentful Webhook Trigger Build


on:
  repository_dispatch: # Allows triggering the workflow via an API call
    types: [contentful-update] # A custom event type you define
jobs:
  trigger-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_FOR_COMMIT }} # A Personal Access Token with repo write scope

      - name: Update timestamp file to trigger redeploy
        run: |
          echo "Last updated by Contentful: $(date)" > last_contentful_update.txt
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions-bot@github.com'
          git add last_contentful_update.txt
          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: Trigger redeploy due to Contentful update [skip ci]"
            git push
          else
            echo "No changes to commit. Timestamp likely identical."
          fi
        env:
          TZ: 'UTC' # Or your preferred timezone

